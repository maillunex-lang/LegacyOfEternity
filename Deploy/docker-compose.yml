services:
  server:
    build:
      context: ../Server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LOE_HTTP_ADDR: ":18780"
    ports:
      - "127.0.0.1:${LOE_BIND_PORT:-18780}:18780"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18780/health"]
      interval: 30s
      timeout: 3s
      retries: 3
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LOE_POSTGRES_DB:-loe_dev}
      POSTGRES_USER: ${LOE_POSTGRES_USER:-loe}
      POSTGRES_PASSWORD: ${LOE_POSTGRES_PASSWORD:?Set LOE_POSTGRES_PASSWORD in Deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOE_POSTGRES_USER:-loe} -d ${LOE_POSTGRES_DB:-loe_dev}"]
      interval: 20s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
